{% extends "base.html" %}

{% block titre %}Créer un compte — Gestion Entrepreneurs{% endblock %}

{% block contenu %}
<div class="mx-auto max-w-md rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
  <h1 class="text-xl font-bold text-slate-900">Créer un compte</h1>
  <p class="mt-1 text-sm text-slate-600">Gratuit. Vous créerez votre entreprise juste après.</p>

  <form method="post" class="mt-6 space-y-4">
    {% csrf_token %}
    {% include "comptes/_champs.html" %}
    <button type="submit"
            class="w-full rounded-lg bg-emerald-700 px-4 py-3 font-semibold text-white hover:bg-emerald-800">
      Créer mon compte
    </button>
  </form>

  <p class="mt-4 text-center text-sm text-slate-600">
    Déjà inscrit ?
    <a href="{% url 'comptes:connexion' %}" class="font-medium text-emerald-700 underline">Se connecter</a>
  </p>
</div>
{% endblock %}
